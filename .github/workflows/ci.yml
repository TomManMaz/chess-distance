name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Cancel older runs of the same PR when new commits land.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint, typecheck, build & test (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Dummy value — build only needs the var to exist; runtime queries
          # aren't executed during `next build` for this app.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Unit tests
        run: npm test

  python:
    name: Python unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: chess-distance-py
          auto-activate-base: false

      - name: Run pytest
        run: pytest -q
