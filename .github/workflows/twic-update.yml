name: Weekly TWIC Update

on:
  schedule:
    - cron: '0 8 * * 2'   # Every Tuesday 8am UTC (TWIC publishes Mondays)
  workflow_dispatch:        # Manual trigger button in GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run incremental TWIC update
        run: node scripts/update-twic.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
